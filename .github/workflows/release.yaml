name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI on main to succeed
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # CI does not run on tags; release the exact commit that CI already
          # validated on main. Tag after main CI is green for an instant start.
          echo "Waiting for CI on main (${{ github.sha }})..."
          missing=0
          while true; do
            status=$(gh run list --repo ${{ github.repository }} --commit ${{ github.sha }} --workflow CI --branch main --event push --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
            echo "CI status: $status"
            if [[ "$status" == "completed success" ]]; then
              echo "CI passed!"
              exit 0
            elif [[ "$status" == "completed"* ]]; then
              echo "CI failed or was cancelled"
              exit 1
            elif [[ -z "$status" || "$status" == "null null" ]]; then
              missing=$((missing + 1))
              if [[ $missing -ge 12 ]]; then
                echo "No CI run found for this commit on main. Push the commit to main before tagging."
                exit 1
              fi
            fi
            sleep 10
          done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # Dedicated cache: the release build cross-compiles 4 targets with
      # -trimpath, which the CI build cache doesn't contain. A per-commit key
      # (with prefix restore) lets each release refresh it.
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            release-go-${{ hashFiles('go.sum') }}-
            release-go-

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
