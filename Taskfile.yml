# https://taskfile.dev
version: '3'

vars:
  BINARY: tack
  BUILD_DIR: bin
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  DATE:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
  LDFLAGS: -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Build the binary
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY}} ./cmd/tack

  build-all:
    desc: Build for all platforms
    deps: [build-linux, build-darwin]

  build-linux:
    desc: Build for Linux (amd64, arm64)
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - for: [amd64, arm64]
        cmd: GOOS=linux GOARCH={{.ITEM}} go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY}}-linux-{{.ITEM}} ./cmd/tack

  build-darwin:
    desc: Build for macOS (amd64, arm64)
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - for: [amd64, arm64]
        cmd: GOOS=darwin GOARCH={{.ITEM}} go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY}}-darwin-{{.ITEM}} ./cmd/tack

  test:
    desc: Run unit tests
    cmds:
      - go test -v -short ./...

  test-coverage:
    desc: Run tests with coverage report
    cmds:
      - go test -short -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  test-integration:
    desc: Run Go integration tests
    cmds:
      - go test -v -timeout 20m ./tests/integration/...

  test-docker:
    desc: Run Docker SSH integration test (all-in-one)
    cmds:
      - task: test-docker-up
      - defer: { task: test-docker-down }
      - task: test-docker-run

  test-docker-up:
    desc: Start 3 SSH Docker containers
    cmds:
      - docker compose -f tests/docker-compose.yaml up -d --build
      - bash tests/setup-keys.sh

  test-docker-run:
    desc: Run playbook against Docker containers
    deps: [build]
    cmds:
      - >-
        ./bin/tack run tests/docker-playbook.yaml
        -c ssh://testuser@127.0.0.1:2201
        -c ssh://testuser@127.0.0.1:2202
        -c ssh://testuser@127.0.0.1:2203
        --ssh-key tests/.ssh/id_ed25519
        --ssh-insecure --auto-approve

  test-docker-down:
    desc: Tear down Docker containers and clean keys
    cmds:
      - docker compose -f tests/docker-compose.yaml down -v
      - rm -rf tests/.ssh

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - rm -f coverage.out coverage.html

  run:
    desc: Run tack directly via go run (pass args after --)
    cmds:
      - go run ./cmd/tack {{.CLI_ARGS}}

  install:
    desc: Build and install to /usr/local/bin
    deps: [build]
    cmds:
      - cp {{.BUILD_DIR}}/{{.BINARY}} /usr/local/bin/

  deps:
    desc: Install dependencies
    cmds:
      - go mod tidy

  validate-examples:
    desc: Validate example playbooks
    cmds:
      - go run ./cmd/tack validate examples/playbooks/*.yaml

  example:
    desc: Run example playbook (dry-run)
    cmds:
      - go run ./cmd/tack run examples/playbooks/setup-dev.yaml --dry-run --debug

  release:
    desc: Create and push a release tag (TAG=vX.Y.Z, prompts with a suggestion when omitted)
    interactive: true
    cmds:
      - |
        TAG="{{.TAG}}"
        if [ -z "$TAG" ]; then
          LATEST=$(git tag --sort=-version:refname 2>/dev/null | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST" ]; then
            SUGGESTED="v0.1.0"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            SUGGESTED="v$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "Latest tag: ${LATEST:-none}"
          printf "Enter tag [%s]: " "$SUGGESTED"
          read -r INPUT_TAG
          TAG="${INPUT_TAG:-$SUGGESTED}"
        fi
        echo "Creating release $TAG..."
        git tag -a "$TAG" -m "Release $TAG"
        git push origin "$TAG"
        echo "Release $TAG pushed. GitHub Actions will build and publish artifacts."

  upgrade-local:
    desc: Wait for a release (TAG=vX.Y.Z, default latest), verify the brew formula, upgrade local install
    cmds:
      - scripts/upgrade-local.sh {{.TAG}}

  release-dry-run:
    desc: Test release without publishing
    cmds:
      - goreleaser release --snapshot --clean --skip=publish

  release-snapshot:
    desc: Create snapshot release
    cmds:
      - goreleaser release --snapshot --clean

  release-check:
    desc: Check GoReleaser configuration
    cmds:
      - goreleaser check
